<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1510" />
      <stop offset="100%" stop-color="#0f0a07" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0916a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c0916a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad)" />
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <circle cx="400" cy="250" r="280" fill="url(#glow)" />

  <!-- Abstract UI Container -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#140e0c" fill-opacity="0.8" stroke="#c0916a" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="80" y="80" width="640" height="50" rx="12" fill="#1e1510" fill-opacity="0.9" />
  <circle cx="110" cy="105" r="6" fill="#ef4444" fill-opacity="0.7" />
  <circle cx="130" cy="105" r="6" fill="#eab308" fill-opacity="0.7" />
  <circle cx="150" cy="105" r="6" fill="#22c55e" fill-opacity="0.7" />
  <text x="400" y="112" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" fill-opacity="0.6" font-weight="500" text-anchor="middle">TASKAI WORKSPACE BOARD</text>

  <!-- Kanban Column (Left) -->
  <rect x="110" y="150" width="280" height="240" rx="8" fill="#1e1510" fill-opacity="0.5" stroke="#c0916a" stroke-opacity="0.1" />
  <text x="130" y="185" font-family="'Outfit', sans-serif" font-size="13" fill="#c0916a" font-weight="600" letter-spacing="1">TODO BACKLOG</text>
  
  <!-- Card Mockups -->
  <rect x="130" y="205" width="240" height="46" rx="6" fill="#261b14" fill-opacity="0.8" />
  <text x="145" y="232" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2">Complete SE235 Presentation</text>
  <rect x="330" y="215" width="30" height="6" rx="3" fill="#ef4444" />

  <rect x="130" y="260" width="240" height="46" rx="6" fill="#261b14" fill-opacity="0.8" />
  <text x="145" y="287" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2">Integrate Dialogflow Engine</text>
  <rect x="330" y="270" width="30" height="6" rx="3" fill="#c0916a" />

  <rect x="130" y="315" width="240" height="46" rx="6" fill="#261b14" fill-opacity="0.8" />
  <text x="145" y="342" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2">Refactor CSS Selectors</text>
  <rect x="330" y="325" width="30" height="6" rx="3" fill="#22c55e" />

  <!-- Right Task Analytics -->
  <rect x="415" y="150" width="275" height="240" rx="8" fill="#1e1510" fill-opacity="0.4" stroke="#c0916a" stroke-opacity="0.1" />
  <text x="435" y="190" font-family="'Outfit', sans-serif" font-size="13" fill="#c0916a" font-weight="600" letter-spacing="1">AI METRICS</text>
  
  <text x="435" y="230" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" font-weight="600">Productivity Level: High</text>
  <text x="435" y="250" font-family="'Outfit', sans-serif" font-size="11" fill="#c4b9ad">AI predicted 15% output gain this week.</text>

  <!-- Circular progress -->
  <circle cx="550" cy="325" r="40" fill="none" stroke="#261b14" stroke-width="6" />
  <circle cx="550" cy="325" r="40" fill="none" stroke="#c0916a" stroke-width="6" stroke-dasharray="251" stroke-dashoffset="50" />
  <text x="550" y="330" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" font-weight="700" text-anchor="middle">80%</text>
</svg>
