<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark brown linear gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1510" />
      <stop offset="100%" stop-color="#0f0a07" />
    </linearGradient>
    <!-- Bronze accent gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0916a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d2a984" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0916a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c0916a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />
  
  <!-- Subtle background grid -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />

  <!-- Ambient Glow in center -->
  <circle cx="400" cy="250" r="280" fill="url(#glow)" />

  <!-- Abstract UI Elements (Smart Farm Telemetry Mockup) -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#140e0c" fill-opacity="0.8" stroke="#c0916a" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- UI Header -->
  <rect x="80" y="80" width="640" height="50" rx="12" fill="#1e1510" fill-opacity="0.9" />
  <circle cx="110" cy="105" r="6" fill="#ef4444" fill-opacity="0.7" />
  <circle cx="130" cy="105" r="6" fill="#eab308" fill-opacity="0.7" />
  <circle cx="150" cy="105" r="6" fill="#22c55e" fill-opacity="0.7" />
  <text x="400" y="112" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" fill-opacity="0.6" font-weight="500" text-anchor="middle">BD KRISHIBID DASHBOARD</text>

  <!-- Left Telemetry Panel -->
  <rect x="110" y="160" width="260" height="230" rx="8" fill="#1e1510" fill-opacity="0.5" stroke="#c0916a" stroke-opacity="0.1" />
  
  <!-- Soil Data Progress Indicator -->
  <text x="130" y="195" font-family="'Outfit', sans-serif" font-size="14" fill="#c0916a" font-weight="600" letter-spacing="1">SOIL MOISTURE</text>
  <circle cx="240" cy="275" r="50" fill="none" stroke="#261b14" stroke-width="8" />
  <circle cx="240" cy="275" r="50" fill="none" stroke="#c0916a" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="78" stroke-linecap="round" />
  <text x="240" y="280" font-family="'Outfit', sans-serif" font-size="18" fill="#faf7f2" font-weight="700" text-anchor="middle">75%</text>

  <!-- Right Diagnostics Panel -->
  <rect x="390" y="160" width="300" height="230" rx="8" fill="#1e1510" fill-opacity="0.5" stroke="#c0916a" stroke-opacity="0.1" />
  <text x="410" y="195" font-family="'Outfit', sans-serif" font-size="14" fill="#c0916a" font-weight="600" letter-spacing="1">AI DIAGNOSTICS</text>
  
  <!-- AI Diagnostics Logs -->
  <rect x="410" y="220" width="260" height="40" rx="6" fill="#261b14" fill-opacity="0.8" />
  <circle cx="430" cy="240" r="4" fill="#c0916a" />
  <text x="450" y="245" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2">Healthy Growth Pattern</text>
  
  <rect x="410" y="275" width="260" height="40" rx="6" fill="#261b14" fill-opacity="0.8" />
  <circle cx="430" cy="295" r="4" fill="#c0916a" />
  <text x="450" y="300" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2">Nitrogen Levels: Optimal</text>

  <rect x="410" y="330" width="260" height="40" rx="6" fill="#261b14" fill-opacity="0.8" />
  <circle cx="430" cy="350" r="4" fill="#ef4444" fill-opacity="0.8" />
  <text x="450" y="355" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2" font-weight="600">Pest Warning: Alert Low</text>

  <!-- Stylized leaf background element -->
  <path d="M 680,100 C 720,130 760,180 750,230 C 740,280 690,320 670,360" fill="none" stroke="#c0916a" stroke-opacity="0.1" stroke-width="4" />
  <path d="M 670,360 C 650,320 600,280 590,230 C 580,180 620,130 680,100" fill="none" stroke="#c0916a" stroke-opacity="0.1" stroke-width="4" />
</svg>
