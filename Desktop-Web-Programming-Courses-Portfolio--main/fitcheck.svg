<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1510" />
      <stop offset="100%" stop-color="#0f0a07" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0916a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c0916a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad)" />
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <circle cx="400" cy="250" r="280" fill="url(#glow)" />

  <!-- Abstract UI Container -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#140e0c" fill-opacity="0.8" stroke="#c0916a" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="80" y="80" width="640" height="50" rx="12" fill="#1e1510" fill-opacity="0.9" />
  <circle cx="110" cy="105" r="6" fill="#ef4444" fill-opacity="0.7" />
  <circle cx="130" cy="105" r="6" fill="#eab308" fill-opacity="0.7" />
  <circle cx="150" cy="105" r="6" fill="#22c55e" fill-opacity="0.7" />
  <text x="400" y="112" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" fill-opacity="0.6" font-weight="500" text-anchor="middle">FITCHECK PERFORMANCE TRACKER</text>

  <!-- Heart Rate / Activity (Left) -->
  <rect x="110" y="150" width="280" height="240" rx="8" fill="#1e1510" fill-opacity="0.5" stroke="#c0916a" stroke-opacity="0.1" />
  
  <!-- Heart symbol outline -->
  <path d="M 250,230 C 250,230 230,200 210,210 C 190,220 195,250 215,265 L 250,295 L 285,265 C 305,250 310,220 290,210 C 270,200 250,230 250,230 Z" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="250" y="325" font-family="'Outfit', sans-serif" font-size="16" fill="#faf7f2" font-weight="600" text-anchor="middle">Health Telemetry</text>
  <text x="250" y="348" font-family="'Outfit', sans-serif" font-size="12" fill="#c0916a" font-weight="500" text-anchor="middle">72 BPM Resting Heart Rate</text>

  <!-- Right Charts -->
  <rect x="415" y="150" width="275" height="240" rx="8" fill="#1e1510" fill-opacity="0.4" stroke="#c0916a" stroke-opacity="0.1" />
  
  <text x="435" y="190" font-family="'Outfit', sans-serif" font-size="13" fill="#c0916a" font-weight="600" letter-spacing="1">WEEKLY WATER INTAKE</text>
  
  <!-- Grid chart bars -->
  <line x1="435" y1="330" x2="670" y2="330" stroke="#261b14" stroke-width="2" />
  
  <line x1="460" y1="330" x2="460" y2="250" stroke="#c0916a" stroke-width="12" stroke-linecap="round" />
  <text x="460" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">M</text>

  <line x1="495" y1="330" x2="495" y2="230" stroke="#c0916a" stroke-width="12" stroke-linecap="round" />
  <text x="495" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">T</text>

  <line x1="530" y1="330" x2="530" y2="270" stroke="#c0916a" stroke-width="12" stroke-linecap="round" />
  <text x="530" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">W</text>

  <line x1="565" y1="330" x2="565" y2="210" stroke="#c0916a" stroke-width="12" stroke-linecap="round" />
  <text x="565" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">T</text>

  <line x1="600" y1="330" x2="600" y2="220" stroke="#c0916a" stroke-dasharray="2 2" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" />
  <text x="600" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">F</text>

  <line x1="635" y1="330" x2="635" y2="290" stroke="#c0916a" stroke-width="12" stroke-linecap="round" />
  <text x="635" y="352" font-family="'Outfit', sans-serif" font-size="10" fill="#c4b9ad" text-anchor="middle">S</text>
</svg>
