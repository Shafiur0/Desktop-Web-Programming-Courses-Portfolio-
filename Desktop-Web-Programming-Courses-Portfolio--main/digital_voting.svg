<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1510" />
      <stop offset="100%" stop-color="#0f0a07" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0916a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c0916a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad)" />
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#c0916a" stroke-opacity="0.05" stroke-width="1" />
  <circle cx="400" cy="250" r="280" fill="url(#glow)" />

  <!-- Abstract UI Container -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#140e0c" fill-opacity="0.8" stroke="#c0916a" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="80" y="80" width="640" height="50" rx="12" fill="#1e1510" fill-opacity="0.9" />
  <circle cx="110" cy="105" r="6" fill="#ef4444" fill-opacity="0.7" />
  <circle cx="130" cy="105" r="6" fill="#eab308" fill-opacity="0.7" />
  <circle cx="150" cy="105" r="6" fill="#22c55e" fill-opacity="0.7" />
  <text x="400" y="112" font-family="'Outfit', sans-serif" font-size="14" fill="#faf7f2" fill-opacity="0.6" font-weight="500" text-anchor="middle">SECURE DIGITAL VOTING SYSTEM</text>

  <!-- Left Ballot Submission Visual -->
  <rect x="110" y="150" width="280" height="240" rx="8" fill="#1e1510" fill-opacity="0.5" stroke="#c0916a" stroke-opacity="0.1" />
  <!-- Security Shield & Ballot box -->
  <path d="M 250,185 L 290,205 L 290,245 C 290,270 250,290 250,290 C 250,290 210,270 210,245 L 210,205 Z" fill="none" stroke="#c0916a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Checkmark -->
  <path d="M 235,235 L 247,247 L 268,223" fill="none" stroke="#c0916a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="250" y="325" font-family="'Outfit', sans-serif" font-size="16" fill="#faf7f2" font-weight="600" text-anchor="middle">Voter Authentication</text>
  <text x="250" y="348" font-family="'Outfit', sans-serif" font-size="12" fill="#c0916a" font-weight="500" text-anchor="middle">SHA-256 Encryption Secured</text>

  <!-- Right Voting Audit Tally -->
  <rect x="415" y="150" width="275" height="240" rx="8" fill="#1e1510" fill-opacity="0.4" stroke="#c0916a" stroke-opacity="0.1" />
  <text x="435" y="190" font-family="'Outfit', sans-serif" font-size="13" fill="#c0916a" font-weight="600" letter-spacing="1">LIVE TALLY RESULTS</text>
  
  <text x="435" y="230" font-family="'Outfit', sans-serif" font-size="13" fill="#faf7f2">Candidate A (Democratic Panel)</text>
  <rect x="435" y="245" width="210" height="10" rx="3" fill="#261b14" />
  <rect x="435" y="245" width="168" height="10" rx="3" fill="#c0916a" />
  <text x="655" y="255" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2" font-weight="600">80%</text>

  <text x="435" y="295" font-family="'Outfit', sans-serif" font-size="13" fill="#faf7f2">Candidate B (Progressive Panel)</text>
  <rect x="435" y="310" width="210" height="10" rx="3" fill="#261b14" />
  <rect x="435" y="310" width="84" height="10" rx="3" fill="#c0916a" fill-opacity="0.5" />
  <text x="655" y="320" font-family="'Outfit', sans-serif" font-size="12" fill="#faf7f2" font-weight="600">40%</text>
  
  <!-- System Status -->
  <circle cx="440" cy="360" r="5" fill="#22c55e" />
  <text x="455" y="364" font-family="'Outfit', sans-serif" font-size="11" fill="#c4b9ad">Audit Nodes Sync: Active (100%)</text>
</svg>
